# Emerald City stack. Copy .env.example to .env (repo root) and fill it in first.
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
services:
  web:
    build: { context: .., dockerfile: deploy/web.Dockerfile }
    env_file: ../.env
    ports: ["3000:3000"]
    restart: unless-stopped

  presence:
    build: { context: .., dockerfile: deploy/services.Dockerfile }
    env_file: ../.env
    command: ["apps/presence/node_modules/.bin/tsx", "apps/presence/src/main.ts"]
    ports: ["8787:8787"]
    restart: unless-stopped

  zeke-host:
    build: { context: .., dockerfile: deploy/services.Dockerfile }
    env_file: ../.env
    environment:
      PRESENCE_URL: ws://presence:8787
    command: ["apps/zeke-host/node_modules/.bin/tsx", "apps/zeke-host/src/main.ts"]
    depends_on: [presence]
    restart: unless-stopped

  zeke-voice:
    build: { context: .., dockerfile: deploy/services.Dockerfile }
    env_file: ../.env
    command: ["apps/zeke-host/node_modules/.bin/tsx", "apps/zeke-host/src/voice.ts", "start"]
    restart: unless-stopped
    profiles: ["voice"]   # needs LiveKit + Deepgram/Cartesia/Anthropic keys: `--profile voice`
