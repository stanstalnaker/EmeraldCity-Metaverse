<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Emerald City 3D</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0c1411; font-family: system-ui, sans-serif; color: #e6efeb; }
      canvas { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      #hud { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; gap: 10px; align-items: center; pointer-events: none; }
      #hud > * { pointer-events: auto; }
      .chip { background: #000a; backdrop-filter: blur(6px); padding: 7px 11px; border-radius: 8px; font-size: 13px; }
      select, button { font: inherit; background: #1fa37a; color: #fff; border: 0; border-radius: 7px; padding: 7px 10px; cursor: pointer; }
      #panel { position: fixed; right: 12px; top: 56px; width: 320px; max-height: 70vh; overflow: auto; display: none; }
      #panel h3 { margin: 0 0 6px; font-size: 15px; }
      #panel a { color: #8ff0cd; }
      #loading { position: fixed; bottom: 14px; left: 12px; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud">
      <span class="chip" id="title">Emerald City</span>
      <select id="teleport" title="Teleport"></select>
      <button id="look" title="Compare with the legacy look">Legacy look</button>
      <span class="chip" id="stats"></span>
    </div>
    <div class="chip" id="panel"></div>
    <div class="chip" id="loading">Loading…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
