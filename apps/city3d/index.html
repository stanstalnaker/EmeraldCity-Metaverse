<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Emerald City 3D</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0c1411; font-family: system-ui, sans-serif; color: #e6efeb; }
      canvas { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      #hud { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; gap: 10px; align-items: center; pointer-events: none; }
      #hud > * { pointer-events: auto; }
      .chip { background: #000a; backdrop-filter: blur(6px); padding: 7px 11px; border-radius: 8px; font-size: 13px; }
      select, button { font: inherit; background: #1fa37a; color: #fff; border: 0; border-radius: 7px; padding: 7px 10px; cursor: pointer; }
      #panel { position: fixed; right: 12px; top: 56px; width: 320px; max-height: 70vh; overflow: auto; display: none; }
      #panel h3 { margin: 0 0 6px; font-size: 15px; }
      #panel a { color: #8ff0cd; }
      #loading { position: fixed; bottom: 14px; left: 12px; }
      #help { position: fixed; bottom: 14px; right: 12px; font-size: 12px; opacity: .85; }
      #compass { position: fixed; top: 58px; left: 50%; transform: translateX(-50%); width: 300px; height: 30px; overflow: hidden; border-radius: 8px; background: #000a; pointer-events: none; }
      #compass-strip { width: 100%; height: 100%; background-repeat: repeat-x; background-size: 600px 30px; }
      #compass::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: #1fa37a; }
      .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #000c; z-index: 20; }
      #map .box { position: relative; display: flex; gap: 16px; max-width: 95vw; max-height: 90vh; }
      #map-image { max-height: 86vh; max-width: 60vw; border-radius: 10px; }
      #map-stops { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: center; }
      #map-stops button { background: #fff1; padding: 6px; }
      #map-stops img { height: 26px; display: block; }
      #screen .box { width: min(1100px, 94vw); height: min(680px, 86vh); display: flex; flex-direction: column; background: #0c1411; border-radius: 12px; overflow: hidden; }
      #screen header { display: flex; gap: 10px; align-items: center; padding: 8px 12px; background: #13201b; }
      #screen header span { flex: 1; font-size: 14px; }
      #screen header a { color: #8ff0cd; font-size: 13px; }
      #screen-body { flex: 1; display: flex; align-items: center; justify-content: center; }
      #screen-body iframe { width: 100%; height: 100%; border: 0; background: #fff; }
      #screen-body img { max-width: 100%; max-height: 100%; }
      #screen-body .empty { max-width: 520px; padding: 24px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud">
      <span class="chip" id="title">Emerald City</span>
      <select id="teleport" title="Teleport"></select>
      <button id="look" title="Compare with the legacy look">Legacy look</button>
      <button id="map-btn" title="Map (M)">Map</button>
      <button id="fly-btn" title="Toggle fly / walk">Fly</button>
      <span class="chip" id="stats"></span>
    </div>
    <div class="chip" id="loading">Loading…</div>
    <div id="compass"><div id="compass-strip"></div></div>
    <div class="chip" id="help">WASD + mouse to move · click screens, lifts, kiosk, magazines, seats · M for map</div>
    <div class="overlay" id="map"><div class="box"><img id="map-image" alt="Emerald City map"><div id="map-stops"></div>
      <button id="map-close" style="position:absolute;top:-10px;right:-10px">✕</button></div></div>
    <div class="overlay" id="screen"><div class="box"><header><span id="screen-title"></span>
      <a id="screen-open" target="_blank" rel="noopener">Open in new tab</a><button id="screen-close">Close</button></header>
      <div id="screen-body"></div></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
